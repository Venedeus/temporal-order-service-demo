global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  - job_name: "order-service"
    static_configs:
      - targets: ['host.docker.internal:8081']
    metrics_path: '/actuator/prometheus'

  - job_name: 'temporal'
    static_configs:
      - targets: ['host.docker.interval:7233']
    metrics_path: '/metrics'